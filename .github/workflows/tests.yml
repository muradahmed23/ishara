name: tests

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest          # the app uses Windows APIs (SendInput, ClipCursor)
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12   # same core the firmware is built and flashed with
      - name: Compile
        run: >
          arduino-cli compile --fqbn esp32:esp32:esp32
          --board-options PartitionScheme=huge_app
          --libraries firmware/libraries
          firmware/ishara_headband
