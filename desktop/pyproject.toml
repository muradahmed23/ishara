[project]
name = "ishara"
version = "2.0.0"
description = "iShara - hands-free computer control: head-tilt mouse headband + offline voice commands"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0",
    "vosk>=0.3.45",
    "sounddevice>=0.5",
    "pywebview>=5.0",
    "faster-whisper>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
